server:
  port: 8088

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: nexushr_user
    password: nexushr_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      pool-name: NotificationHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true
    ignore-missing-migrations: true
    validate-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: nexushr_redis

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:nexushr-secret-key-change-in-production-minimum-256-bits}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.amdox.nexushr: DEBUG