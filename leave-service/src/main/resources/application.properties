server.port=8087

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nexushr
spring.datasource.username=nexushr_user
spring.datasource.password=nexushr_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.table=leave_flyway_schema_history

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=nexushr_redis

# Logging
logging.level.com.amdox.nexushr=DEBUG
logging.level.org.flywaydb=INFO