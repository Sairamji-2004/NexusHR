server:
  port: 8085

spring:
  application:
    name: performance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/performance_db
    username: nexushr_user
    password: nexushr_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      pool-name: PerformanceHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    out-of-order: true
    ignore-missing-migrations: true
    validate-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: nexushr_redis

jwt:
  secret:  ${JWT_SECRET:nexushr-secret-key-change-in-production-minimum-256-bits}

  springdoc:
    swagger-ui:
      enabled: true
    api-docs:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.amdox.nexushr: DEBUG