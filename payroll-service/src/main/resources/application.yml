server:
  port: 8084

spring:
  application:
    name: payroll-service

  datasource:
    url: jdbc:postgresql://localhost:5432/payroll_db
    username: nexushr_user
    password: nexushr_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      pool-name: PayrollHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    out-of-order: true
    ignore-missing-migrations: true
    validate-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: nexushr_redis

jwt:
  secret: nexushr-secret-key-change-in-production-minimum-256-bits

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.amdox.nexushr: DEBUG